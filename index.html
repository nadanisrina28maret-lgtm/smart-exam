<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart Exam — Ujian Online</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#1d2433;--muted:#667085;--line:#e3e7ef;--pri:#2457d6;--pri2:#1b44ab;--ok:#16834a;--okbg:#e7f6ee;--bad:#c4321f;--badbg:#fdecea;--warn:#a15c00;--warnbg:#fff4e0;--chip:#eef2fb;--r:12px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--pri)}
.wrap{max-width:960px;margin:0 auto;padding:16px}
.narrow{max-width:480px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin:12px 0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
h1{font-size:22px;margin:4px 0 2px}h2{font-size:18px;margin:0 0 8px}h3{font-size:16px;margin:0 0 6px}
.muted{color:var(--muted)}.small{font-size:13px}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:600;display:inline-flex;gap:6px;align-items:center;justify-content:center;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:#c7cfdd}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}.btn.pri:hover{background:var(--pri2)}
.btn.big{padding:14px 18px;font-size:16px;width:100%;letter-spacing:.3px}
.btn.danger{color:var(--bad)}.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.55;cursor:not-allowed}
label.f{display:block;font-weight:600;margin:12px 0 5px}
.inp{width:100%;border:1px solid #cfd6e3;border-radius:10px;padding:10px 12px;background:#fff}
.inp:focus,.ed:focus{outline:2px solid #b9cbf7;border-color:var(--pri)}
.msg{border-radius:10px;padding:10px 12px;margin:10px 0;white-space:pre-line}
.msg.err{background:var(--badbg);color:var(--bad)}.msg.ok{background:var(--okbg);color:var(--ok)}.msg.warn{background:var(--warnbg);color:var(--warn)}.msg.info{background:var(--chip);color:#2b3a67}
.chip{display:inline-block;background:var(--chip);border-radius:999px;padding:2px 10px;font-size:13px;font-weight:600;color:#2b3a67}
.chip.ok{background:var(--okbg);color:var(--ok)}.chip.bad{background:var(--badbg);color:var(--bad)}.chip.warn{background:var(--warnbg);color:var(--warn)}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:800;letter-spacing:4px}
.topbar{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.topbar .wrap{padding:10px 16px;display:flex;align-items:center;gap:12px}
.brand{font-weight:800;color:var(--pri)}
.qhtml img,.ed img,.stim img{max-width:100%;height:auto}
.qhtml table,.ed table,.stim table{border-collapse:collapse;margin:8px 0;max-width:100%}
.qhtml td,.qhtml th,.ed td,.ed th,.stim td,.stim th{border:1px solid #b8c0cf;padding:4px 8px;vertical-align:top}
.qhtml p,.ed p,.stim p{margin:4px 0}
.se-warn{background:var(--badbg);color:var(--bad);font-weight:600;border-radius:6px;padding:1px 6px}
.se-math{font-family:"Cambria Math","Times New Roman",serif;font-style:italic;background:#f2f4fa;padding:0 3px;border-radius:4px}
.ed{border:1px dashed #c9d1e0;border-radius:8px;padding:8px 10px;min-height:38px;background:#fff}
.ed:empty:before{content:attr(data-ph);color:#98a2b3}
.drop{border:2px dashed #aebbd6;border-radius:var(--r);padding:34px 16px;text-align:center;background:#fafbff;cursor:pointer}
.drop.over{border-color:var(--pri);background:#eef3ff}
table.tb{width:100%;border-collapse:collapse;font-size:14px}
table.tb th,table.tb td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:top}
table.tb th{font-size:12px;text-transform:uppercase;color:var(--muted);letter-spacing:.3px}
.scroll{overflow-x:auto}
.qcard{border-left:4px solid var(--line)}
.qcard.need{border-left-color:#f0a020}
.qcard.bad{border-left-color:var(--bad)}
.opt{display:flex;gap:8px;align-items:flex-start;margin:6px 0}
.opt .ed{flex:1}
.letter{width:28px;height:28px;border-radius:50%;background:var(--chip);display:inline-flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.keyon{background:var(--ok);color:#fff}
.warnlist{margin:6px 0 0;padding-left:18px;color:var(--warn);font-size:13px}
.sticky-foot{position:sticky;bottom:0;background:rgba(244,246,251,.95);backdrop-filter:blur(4px);border-top:1px solid var(--line);padding:10px 0;z-index:15}
.stimcard{background:#fffdf4;border-color:#f1e3b5}
/* ujian siswa */
.exam-top{background:#1f3a8a;color:#fff;position:sticky;top:0;z-index:20}
.exam-top .wrap{padding:8px 16px;display:flex;gap:10px;align-items:center}
.timer{font-family:ui-monospace,monospace;font-weight:800;font-size:18px;background:rgba(255,255,255,.15);padding:4px 10px;border-radius:8px}
.timer.low{background:#e0452f}
.choice{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:2px solid var(--line);background:#fff;border-radius:12px;padding:11px 12px;margin:8px 0;cursor:pointer}
.choice:hover{border-color:#b8c6e8}
.choice.sel{border-color:var(--pri);background:#eef3ff}
.choice.sel .letter{background:var(--pri);color:#fff}
.choice .qhtml{flex:1}
.navgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px}
.navgrid button{height:40px;border-radius:8px;border:1px solid var(--line);background:#fff;font-weight:700;cursor:pointer}
.navgrid button.ans{background:var(--okbg);border-color:#9ad3b3;color:var(--ok)}
.navgrid button.ragu{background:#fff4d6;border-color:#f2c357;color:#8a5a00}
.navgrid button.cur{outline:3px solid var(--pri)}
.bsrow{display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--line);padding:8px 0}
.bsrow .qhtml{flex:1}
.tog{border:2px solid var(--line);background:#fff;border-radius:8px;padding:6px 10px;font-weight:700;cursor:pointer;min-width:70px}
.tog.on{border-color:var(--pri);background:var(--pri);color:#fff}
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal{background:#fff;border-radius:16px;max-width:560px;width:100%;max-height:90vh;overflow:auto;padding:20px}
.modal.wide{max-width:880px}
.bigcode{font-size:44px;text-align:center;margin:8px 0;color:var(--pri)}
.present{position:fixed;inset:0;background:#fff;z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:20px}
.present .code{font-size:min(16vw,140px);color:var(--pri)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.stat{background:var(--chip);border-radius:10px;padding:10px}
.stat b{display:block;font-size:22px}
.spin{display:inline-block;width:18px;height:18px;border:3px solid #c9d5f3;border-top-color:var(--pri);border-radius:50%;animation:sp 1s linear infinite;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
.demo-banner{background:#fff4e0;color:#7a4b00;font-size:13px;text-align:center;padding:6px 10px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1d2433;color:#fff;padding:10px 16px;border-radius:10px;z-index:300;font-weight:600}
details>summary{cursor:pointer;font-weight:600}
.noselect{user-select:none;-webkit-user-select:none}
.qhtml table,.stim table{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch}
.actbar{position:sticky;bottom:0;z-index:12;background:var(--bg);padding:8px 0 10px;display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.actbar .btn{padding:12px 10px;min-height:46px;white-space:nowrap}
.show-sm{display:none}
body.typing .actbar{position:static}
.choice,.tog,.navgrid button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
@media(max-width:640px){.wrap{padding:10px}.card{padding:14px}.bigcode{font-size:34px}.hide-sm{display:none}
 .inp,select.inp,textarea.inp{font-size:16px}
 .show-sm{display:inline}
 .exam-top .wrap{padding:8px 12px}.timer{font-size:17px}
 .bsrow{flex-wrap:wrap}.bsrow .qhtml{flex-basis:100%}.bsrow .tog{flex:1;min-height:44px}
 .jd-row{flex-wrap:wrap}.jd-row .qhtml{flex-basis:calc(100% - 40px)}.jd-row select{flex:1;min-height:44px}
 .navgrid{grid-template-columns:repeat(auto-fill,minmax(44px,1fr))}.navgrid button{height:44px}}
</style>
</head>
<body>
<div id="demoBanner"></div>
<script>window.SE_MODE = "vercel";</script>
<div id="app"></div>
<script>
/* ============================================================
 * SMART EXAM — CORE (dipakai di server Apps Script & mode demo)
 * Semua logika bisnis: kode ujian, masuk siswa, batas percobaan,
 * penilaian, rekap. Penyimpanan lewat "adapter" (S).
 * ============================================================ */
var SECore = (function () {
  'use strict';

  var CODE_CHARS = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789'; // tanpa 0 O 1 I L
  var GRACE_MS = 2 * 60 * 1000; // toleransi kirim setelah waktu habis

  function err(msg) { var e = new Error(msg); e.userMessage = msg; return e; }
  function normKey(s) { return String(s || '').toLowerCase().replace(/\s+/g, ' ').trim(); }
  function normKelas(s) { return String(s || '').toUpperCase().replace(/[\s\-_.]+/g, ''); }
  function randStr(n, chars) {
    chars = chars || 'abcdefghijklmnopqrstuvwxyz0123456789';
    var s = ''; for (var i = 0; i < n; i++) s += chars.charAt(Math.floor(Math.random() * chars.length));
    return s;
  }
  function isEmpty(v) {
    if (v === undefined || v === null) return true;
    if (typeof v === 'string') return v.trim() === '';
    if (Array.isArray(v)) return v.length === 0;
    if (typeof v === 'object') return Object.keys(v).length === 0;
    return false;
  }
  function normText(s) {
    return String(s || '').toLowerCase()
      .replace(/<[^>]*>/g, ' ')
      .replace(/[‘’]/g, "'").replace(/[“”]/g, '"')
      .replace(/[.,;:!?"'()\[\]{}]/g, ' ')
      .replace(/\s+/g, ' ').trim();
  }
  function asNumber(s) {
    var t = String(s || '').trim().replace(/\s/g, '');
    if (!/^[-+]?\d+([.,]\d+)?$/.test(t)) return null;
    return parseFloat(t.replace(',', '.'));
  }

  /* ---------------- PENILAIAN ---------------- */
  // Mengembalikan {nilai, benar, salah, kosong, menunggu, totalBobot, perSoal:{qid:{status,skor,bobot}}}
  function grade(content, answers, manual, rules) {
    answers = answers || {}; manual = manual || {}; rules = rules || {};
    var partial = rules.skorParsial !== false;
    var res = { benar: 0, salah: 0, kosong: 0, menunggu: 0, totalBobot: 0, didapat: 0, perSoal: {} };
    (content.questions || []).forEach(function (q) {
      var w = Number(q.weight) > 0 ? Number(q.weight) : 1;
      res.totalBobot += w;
      var a = answers[q.id];
      var st = 'salah', sk = 0;
      if (q.type === 'URAIAN') {
        if (manual[q.id] !== undefined && manual[q.id] !== null && manual[q.id] !== '') {
          sk = Math.max(0, Math.min(w, Number(manual[q.id]) || 0));
          st = isEmpty(a) ? 'kosong' : (sk >= w ? 'benar' : 'dinilai');
        } else {
          st = isEmpty(a) ? 'kosong' : 'menunggu';
        }
      } else if (isEmpty(a)) {
        st = 'kosong';
      } else if (q.type === 'PG') {
        if (String(a) === String(q.key)) { st = 'benar'; sk = w; }
      } else if (q.type === 'PGK') {
        var key = (q.key || []).slice().sort().join(',');
        var got = (Array.isArray(a) ? a : [a]).slice().sort().join(',');
        if (key && key === got) { st = 'benar'; sk = w; }
      } else if (q.type === 'BS') {
        var sts = q.statements || [], ok = 0, answered = 0;
        sts.forEach(function (s) {
          if (a[s.id] !== undefined && a[s.id] !== null) answered++;
          if (a[s.id] === s.key) ok++;
        });
        if (answered === 0) st = 'kosong';
        else if (ok === sts.length) { st = 'benar'; sk = w; }
        else { sk = partial && sts.length ? w * ok / sts.length : 0; }
      } else if (q.type === 'JODOH') {
        var left = (q.pairs && q.pairs.left) || [], k2 = (q.pairs && q.pairs.key) || {}, ok2 = 0, ans2 = 0;
        left.forEach(function (l) {
          if (a[l.id]) ans2++;
          if (a[l.id] && a[l.id] === k2[l.id]) ok2++;
        });
        if (ans2 === 0) st = 'kosong';
        else if (ok2 === left.length) { st = 'benar'; sk = w; }
        else { sk = partial && left.length ? w * ok2 / left.length : 0; }
      } else if (q.type === 'ISIAN') {
        var ta = normText(a), na = asNumber(a);
        var hit = (q.answers || []).some(function (k) {
          var nk = asNumber(k);
          if (na !== null && nk !== null) return Math.abs(na - nk) < 1e-9;
          return normText(k) === ta && ta !== '';
        });
        if (hit) { st = 'benar'; sk = w; }
      }
      if (st === 'benar') res.benar++;
      else if (st === 'kosong') res.kosong++;
      else if (st === 'menunggu') res.menunggu++;
      else res.salah++;
      res.didapat += sk;
      res.perSoal[q.id] = { status: st, skor: Math.round(sk * 100) / 100, bobot: w };
    });
    res.nilai = res.totalBobot ? Math.round(res.didapat / res.totalBobot * 10000) / 100 : 0;
    return res;
  }

  /* ---------------- KONTEN UNTUK SISWA (tanpa kunci) ---------------- */
  function studentContent(content) {
    var qs = (content.questions || []).map(function (q) {
      var o = { id: q.id, type: q.type, html: q.html, stimulusId: q.stimulusId || null, weight: q.weight || 1 };
      if (q.type === 'PG' || q.type === 'PGK') o.options = q.options;
      if (q.type === 'BS') {
        o.statements = (q.statements || []).map(function (s) { return { id: s.id, html: s.html }; });
        o.labels = q.labels || ['Benar', 'Salah'];
      }
      if (q.type === 'JODOH') {
        o.pairs = { left: q.pairs.left, right: q.pairs.right };
      }
      return o;
    });
    return { questions: qs, stimuli: content.stimuli || [] };
  }

  function validateContent(content) {
    var problems = [];
    var qs = content.questions || [];
    if (!qs.length) problems.push('Belum ada soal.');
    qs.forEach(function (q, i) {
      var n = 'Soal ' + (i + 1);
      if (!q.type) problems.push(n + ': jenis soal belum ditentukan.');
      else if (q.type === 'PG' && !q.key) problems.push(n + ': kunci jawaban belum diatur.');
      else if (q.type === 'PGK' && !(q.key && q.key.length)) problems.push(n + ': kunci jawaban belum diatur.');
      else if (q.type === 'BS' && (!(q.statements && q.statements.length) || q.statements.some(function (s) { return s.key !== true && s.key !== false; }))) problems.push(n + ': kunci Benar/Salah belum lengkap.');
      else if (q.type === 'JODOH' && (!(q.pairs && q.pairs.left && q.pairs.left.length) || q.pairs.left.some(function (l) { return !q.pairs.key || !q.pairs.key[l.id]; }))) problems.push(n + ': pasangan jawaban belum lengkap.');
      else if (q.type === 'ISIAN' && !(q.answers && q.answers.filter(function (x) { return String(x).trim(); }).length)) problems.push(n + ': jawaban isian belum diisi.');
      if ((q.type === 'PG' || q.type === 'PGK') && (!q.options || q.options.length < 2)) problems.push(n + ': pilihan jawaban kurang dari 2.');
    });
    return problems;
  }

  /* ---------------- STATUS WAKTU ---------------- */
  function examWindow(meta, now) {
    if (meta.status === 'nonaktif') return { ok: false, state: 'nonaktif', msg: 'Ujian ini sedang dinonaktifkan oleh guru.' };
    if (meta.mulai && now < meta.mulai) return { ok: false, state: 'belum', msg: 'Ujian belum dimulai.', mulai: meta.mulai };
    if (meta.selesai && now > meta.selesai) return { ok: false, state: 'tutup', msg: 'Waktu ujian sudah ditutup.' };
    return { ok: true, state: 'buka' };
  }

  function makeApi(S) {
    function requireTeacher(token) {
      if (!token || !S.checkToken(token)) throw err('Sesi guru berakhir. Silakan masuk lagi.');
    }
    function getMetaOrFail(kode) {
      var m = S.getMeta(String(kode || '').toUpperCase().trim());
      if (!m || m.status === 'dihapus') throw err('Kode ujian tidak ditemukan. Periksa kembali kode dari guru.');
      return m;
    }
    function deadlineOf(meta, r) {
      var d = r.mulai + meta.durasi * 60000;
      if (meta.selesai) d = Math.min(d, meta.selesai);
      return d;
    }
    function finalize(meta, r, answers, violations, reason) {
      var content = S.getContent(meta.kode);
      var now = S.now();
      if (answers) r.jawaban = answers;
      if (typeof violations === 'number') r.pelanggaran = Math.max(r.pelanggaran || 0, violations);
      var g = grade(content, r.jawaban, r.skorManual, meta.aturan);
      r.status = 'selesai';
      r.selesai = Math.min(now, deadlineOf(meta, r) + GRACE_MS);
      r.durasiDetik = Math.max(0, Math.round((r.selesai - r.mulai) / 1000));
      r.nilai = g.nilai; r.benar = g.benar; r.salah = g.salah; r.kosong = g.kosong; r.menunggu = g.menunggu;
      r.detailSkor = g.perSoal;
      if (reason) r.catatan = reason;
      S.putResult(r);
      return g;
    }
    function closeStale(meta) {
      var now = S.now();
      S.listResults(meta.kode).forEach(function (r) {
        if (r.status === 'berlangsung' && now > deadlineOf(meta, r) + GRACE_MS) {
          S.lock(function () { finalize(meta, r, null, null, 'Dikumpulkan otomatis (waktu habis) dari jawaban tersimpan terakhir'); });
        }
      });
    }

    var api = {
      /* ===== GURU ===== */
      hasPin: function () { return !!S.getSetting('pinHash'); },
      setupPin: function (pin) {
        if (S.getSetting('pinHash')) throw err('PIN guru sudah dibuat sebelumnya.');
        if (!pin || String(pin).length < 4) throw err('PIN minimal 4 karakter.');
        var salt = randStr(12);
        S.setSetting('pinSalt', salt);
        S.setSetting('pinHash', S.hash(salt + String(pin)));
        return S.newToken();
      },
      login: function (pin) {
        var h = S.getSetting('pinHash');
        if (!h) throw err('PIN guru belum dibuat.');
        if (S.hash(S.getSetting('pinSalt') + String(pin)) !== h) throw err('PIN salah.');
        return S.newToken();
      },
      changePin: function (token, oldPin, newPin) {
        requireTeacher(token);
        if (S.hash(S.getSetting('pinSalt') + String(oldPin)) !== S.getSetting('pinHash')) throw err('PIN lama salah.');
        if (!newPin || String(newPin).length < 4) throw err('PIN baru minimal 4 karakter.');
        var salt = randStr(12);
        S.setSetting('pinSalt', salt);
        S.setSetting('pinHash', S.hash(salt + String(newPin)));
        return true;
      },
      createExam: function (token, meta, content) {
        requireTeacher(token);
        var probs = validateContent(content);
        if (probs.length) throw err('Ujian belum bisa dibuat:\n• ' + probs.slice(0, 8).join('\n• ') + (probs.length > 8 ? '\n• …dan ' + (probs.length - 8) + ' lainnya' : ''));
        if (!meta.nama) throw err('Nama ujian wajib diisi.');
        if (!(meta.durasi > 0)) throw err('Durasi wajib diisi (menit).');
        return S.lock(function () {
          var kode;
          for (var i = 0; i < 50; i++) { kode = randStr(6, CODE_CHARS); if (!S.getMeta(kode)) break; }
          var m = {
            kode: kode, nama: String(meta.nama).trim(), jenjang: meta.jenjang || '', mapel: meta.mapel || '',
            kelasList: (meta.kelasList || []).map(function (k) { return String(k).trim(); }).filter(String),
            durasi: Number(meta.durasi), mulai: meta.mulai || null, selesai: meta.selesai || null,
            aturan: meta.aturan || {}, jumlahSoal: content.questions.length, dibuat: S.now(), status: 'aktif'
          };
          S.putContent(kode, content);
          S.putMeta(m);
          return m;
        });
      },
      updateExam: function (token, kode, meta, content) {
        requireTeacher(token);
        var m = getMetaOrFail(kode);
        if (content) {
          var probs = validateContent(content);
          if (probs.length) throw err('Perubahan belum bisa disimpan:\n• ' + probs.slice(0, 8).join('\n• '));
        }
        return S.lock(function () {
          ['nama', 'jenjang', 'mapel', 'kelasList', 'durasi', 'mulai', 'selesai', 'aturan', 'status'].forEach(function (k) {
            if (meta && meta[k] !== undefined) m[k] = meta[k];
          });
          if (content) { S.putContent(m.kode, content); m.jumlahSoal = content.questions.length; }
          S.putMeta(m);
          return m;
        });
      },
      deleteExam: function (token, kode) {
        requireTeacher(token);
        var m = getMetaOrFail(kode);
        m.status = 'dihapus'; S.putMeta(m); return true;
      },
      listExams: function (token) {
        requireTeacher(token);
        var now = S.now();
        return S.listMetas().filter(function (m) { return m.status !== 'dihapus'; }).map(function (m) {
          var rs = S.listResults(m.kode);
          m.peserta = rs.length;

        if (!om) { cur.explParts.push(b.html); continue; }
      }

      // ----- pilihan jawaban -----
      if (om && cur && (cur.section === 'URAIAN' || cur.section === 'ISIAN') && !cur.opts.length) om = null; // a) b) di soal uraian = sub-pertanyaan

          state = 'options'; continue;
        }
        if (L === expected || (state === 'options' && L.charCodeAt(0) > expected.charCodeAt(0))) {
          if (L !== expected) cur.warnings.push('Pilihan ' + expected + ' tidak ditemukan (langsung ke ' + L + ').');
          var oh = innerAfterMarker(b.html, om[0].replace(/^⁣/, '').length);

        }
        if (L === 'A' && state === 'options') {

          cur.warnings.push('Nomor soal tidak terbaca: pilihan jawaban baru dimulai tanpa nomor. Periksa isi pertanyaannya.');

        // pilihan tanpa soal sebelumnya
        newQ(null, '');

        cur.opts.push({ L: om[1].toUpperCase(), html: innerAfterMarker(b.html, om[0].length) });

      }

      if (!cur) {
        if (!started) {
          if (INSTR_RE.test(t)) { var it = instrTypeOf(t); if (it && !section) section = it; }

        } else {
          if (INSTR_RE.test(t) && t.length < 250 && !hasMedia(b.html)) { var it2 = instrTypeOf(t); if (it2) section = it2; buffer.push({ html: b.html, text: t, instr: true }); ignored.push(t); }

        var last = cur.opts[cur.opts.length - 1];
        var onlyImg = /<img/i.test(b.html) && !t;
        var nextIsOpt = blocks[i + 1] && blocks[i + 1].kind === 'p' && OPT_RE.test(blocks[i + 1].raw || blocks[i + 1].text);
        if (last && onlyImg && (!plain('<p>' + last.html + '</p>') || nextIsOpt)) { last.html += b.html; continue; }
        if (last && b.kind === 'table' && !plain('<p>' + last.html + '</p>')) { last.html += b.html; continue; }
        if (INSTR_RE.test(t) && t.length < 250 && !hasMedia(b.html)) { var it3 = instrTypeOf(t); if (it3) section = it3; ignored.push(t); continue; }

      }

      var parts = s.parts.slice();
      // kalimat penanda ("Bacaan berikut untuk soal nomor 5–6") dibuang: nomor tampil otomatis & bisa berubah saat diacak

      return { id: s.id, html: sanitize(parts.join('')), range: s.from + '–' + s.to };

  /* ---------- tentukan jenis soal ---------- */
  function finalizeQ(c) {

  }

  function collectInlineWarnings(q) {
    var parts = [q.html, q.explanation].concat(q.options.map(function (o) { return o.html; }));
    var s = parts.join(' ');
    function fix(h) {
      return h.replace(/⟦!(GRAFIK|SMARTART|OLE|OLEMATH)⟧/g, function (_, k) {
        return '<span class="se-warn">[' + ({ GRAFIK: 'Grafik tidak terbaca — ganti dengan gambar', SMARTART: 'SmartArt tidak terbaca — ganti dengan gambar', OLE: 'Objek sisipan tidak terbaca', OLEMATH: 'Rumus lama (Equation 3.0/MathType) tidak terbaca — ketik ulang' }[k]) + ']</span>';

      }).replace(/⟦M⟧([\s\S]*?)⟦\/M⟧/g, '<span class="se-math">$1</span>');

    q.options.forEach(function (o) { o.html = fix(o.html); });

  function fixStimulus(s) {

    s.html = s.html.replace(/⟦M⟧([\s\S]*?)⟦\/M⟧/g, '<span class="se-math">$1</span>')
      .replace(/⟦!(GRAFIK|SMARTART|OLE|OLEMATH)⟧/g, '<span class="se-warn">[Bagian ini tidak terbaca — ganti dengan gambar]</span>')
      .replace(/<img[^>]*alt="⟦!IMG:([^"]*)⟧"[^>]*>/g, '<span class="se-warn">[Gambar tidak bisa ditampilkan — ganti dengan PNG/JPG]</span>');

  function importDocx(arrayBuffer, fileName) {
    var report = { fileName: fileName, source: 'word', warnings: [], info: [], ignored: [] };

  /* ============================================================
   *  EXCEL (.xlsx / .xls)
   * ============================================================ */
  var COLS = {
    no: /^(no\.?|nomor|no\s*soal)$/i,
    soal: /^(soal|pertanyaan|butir\s*soal|teks\s*soal|isi\s*soal)$/i,
    jenis: /^(jenis(\s*soal)?|tipe(\s*soal)?|bentuk(\s*soal)?)$/i,
    kunci: /^(kunci(\s*jawaban)?|jawaban(\s*benar)?|answer|key)$/i,
    pembahasan: /^(pembahasan|penjelasan)$/i,
    stimulus: /^(stimulus|bacaan|wacana|teks\s*bacaan)$/i,
    gambar: /^(gambar|image|foto)$/i,

  function xlsxImages(arrayBuffer, sheetNames) {

            return Promise.all([zip.file(dpath).async('string'), zip.file(drelPath).async('string')]).then(function (dd) {
              var dx = xp.parseFromString(dd[0], 'application/xml'), drl = xp.parseFromString(dd[1], 'application/xml');
              var media = {};
              all(drl, 'Relationship').forEach(function (x) { media[x.getAttribute('Id')] = resolve(dpath, x.getAttribute('Target')); });
              var anchors = all(dx, 'xdr:twoCellAnchor').concat(all(dx, 'xdr:oneCellAnchor'));
              return Promise.all(anchors.map(function (a) {
                var from = a.getElementsByTagName('xdr:from')[0]; if (!from) return null;
                var row = parseInt(from.getElementsByTagName('xdr:row')[0].textContent, 10);
                var col = parseInt(from.getElementsByTagName('xdr:col')[0].textContent, 10);
                var blip = a.getElementsByTagName('a:blip')[0]; if (!blip) return null;

  function importExcel(arrayBuffer, fileName) {

    XLSX.utils.book_append_sheet(wb, ws1, 'Rekap Nilai');
    var h2 = ['Nama Lengkap', 'Kelas'].concat(qs.map(function (q, i) { return 'S' + (i + 1) + ' (' + TYPE_SHORT[q.type] + ')'; }));
    var keyRow = ['KUNCI', ''].concat(qs.map(function (q) { return plainOf(keyText(q)); }));
    var r2 = rs.map(function (r) {
      return [r.nama, r.kelas].concat(qs.map(function (q) {
        var st = (r.detailSkor || {})[q.id] || {};
        var a = plainOf(ansText(q, (r.jawaban || {})[q.id]));
        var mark = { benar: ' ✓', salah: ' ✗', kosong: '', menunggu: ' (belum dinilai)', dinilai: ' (' + st.skor + '/' + st.bobot + ')' }[st.status] || '';
        return (a === '(kosong)' ? '-' : a) + mark;
      }));
    });
    var ws2 = XLSX.utils.aoa_to_sheet([h2, keyRow].concat(r2));
    ws2['!cols'] = h2.map(function (x, i) { return { wch: i === 0 ? 28 : i === 1 ? 8 : 16 }; });
    XLSX.utils.book_append_sheet(wb, ws2, 'Jawaban per Soal');
    var info = [['Nama ujian', m.nama], ['Kode ujian', m.kode], ['Mata pelajaran', m.mapel], ['Jenjang', m.jenjang], ['Jumlah soal', qs.length], ['Durasi (menit)', m.durasi], ['Mulai', m.mulai ? fmtDT(m.mulai) : 'kapan saja'], ['Berakhir', m.selesai ? fmtDT(m.selesai) : 'tanpa batas'], ['Jumlah peserta', rs.length], ['Diunduh', fmtDT(Date.now())]];
    var ws3 = XLSX.utils.aoa_to_sheet(info); ws3['!cols'] = [{ wch: 18 }, { wch: 40 }];
    XLSX.utils.book_append_sheet(wb, ws3, 'Info Ujian');
    var fn = 'Rekap_' + m.kode + '_' + m.nama.replace(/[^\w\- ]+/g, '').replace(/\s+/g, '_').slice(0, 40) + '.xlsx';
    return saveWorkbook(wb, fn).then(function () { toast('File Excel dibuat'); });
  }).catch(function (e) { toast(e.message || 'Gagal membuat Excel'); }).then(function () { if (btn) { btn.disabled = false; btn.innerHTML = old; } });
}
